<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDI - Plano de Desenvolvimento Individual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header class="header">
        <h1>PDI - Plano de Desenvolvimento Individual</h1>
        <p>Jornada para Coordenação Técnica</p>
    </header>

    <section class="objetivo-principal">
        <h2>🎯 Objetivo Principal</h2>
        <p><strong>Iniciar entrevistas para posição de Coordenação até Julho de 2026</strong></p>
    </section>

    <section class="controles">
        <div class="controle-grupo custom-select-wrapper">
            <label for="tipoVisualizacao">Visualização:</label>
            <select id="tipoVisualizacao">
                <option value="semestre">Por Semestre</option>
                <option value="trimestre">Por Trimestre</option>
            </select>
        </div>
        <div class="controle-grupo custom-select-wrapper">
            <label for="selectAnosVisiveis">Período:</label>
            <select id="selectAnosVisiveis">
                <option value="1">1 Ano</option>
                <option value="2">2 Anos</option>
                <option value="3" selected>3 Anos</option>
                <option value="4">4 Anos</option>
                <option value="5">5 Anos</option>
            </select>
        </div>
        <button class="btn btn-export" id="btnExportarPDI">📤 Exportar JSON</button>
        <button class="btn" id="btnCarregarPDI">📂 Carregar JSON</button>
    </section>

    <main class="main-content">
        <div class="secao-grid">
            <section class="secao" id="secaoPontosFortes">
                <h3>💪 Pontos Fortes</h3>
                <div class="cards-container" id="pontosFortesContainer"></div>
            </section>
            <section class="secao" id="secaoPontosMelhoria">
                <h3>📈 Pontos de Melhoria</h3>
                <div class="cards-container" id="pontosMelhoriaContainer"></div>
            </section>
        </div>

        <section class="secao">
            <h3>📚 Áreas de Desenvolvimento</h3>
            <div class="legenda" id="legendaContainer"></div>
        </section>

        <section class="secao" id="secaoCronograma">
            <h3>🗓️ Cronograma de Desenvolvimento</h3>
            <div class="timeline-container">
                <div class="timeline-header" id="timeline-header"></div>
                <div class="timeline-body" id="timeline-body"></div>
            </div>
        </section>

        <section class="secao metricas" id="secaoMetricas">
            <h3>📊 Métricas de Acompanhamento</h3>
            <div id="metricasContainer"></div>
        </section>
    </main>
</div>

<div id="modal-container"></div>
<div id="colorPalettePopup" class="color-palette-popup"></div>
<input type="file" id="fileUploader" accept=".json" style="display: none;">

<script src="script.js"></script>
</body>
</html>
